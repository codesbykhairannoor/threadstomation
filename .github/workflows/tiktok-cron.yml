name: TikTok Automation Cron

on:
  schedule:
    # Runs at :24 and :54 of every hour
    - cron: '24,54 * * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Target TikTok Account'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - maritumbuhbersama
      force:
        description: 'Force run immediately (bypass daily limit)'
        type: boolean
        default: false

jobs:
  run-tiktok:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Build Tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libjpeg-dev zlib1g-dev python3-dev build-essential

      - name: Run Dedicated TikTok Cron
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.account }}" ] && [ "${{ inputs.account }}" != "all" ]; then
            ARGS="$ARGS --account ${{ inputs.account }}"
          fi
          node scripts/tiktok-cron.mjs $ARGS

