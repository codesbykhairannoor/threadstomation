name: Master Cron (Threads & IG)

on:
  schedule:
    # Single clean 15-minute schedule to ensure GitHub Actions scheduler does not drop queue
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Build Tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libjpeg-dev zlib1g-dev python3-dev build-essential

      - name: Install Python Video Dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt || pip install git+https://github.com/Chamanrajragu/purffle-shorts.git Pillow edge-tts requests

      - name: Run Master Cron (Threads & IG)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || 'NSq2RqXrKm1djxxjPXmv5VKS0ZFBByBr0mv0yd2guVlqpFjD6tx7TDv4' }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: node scripts/master-cron.mjs
