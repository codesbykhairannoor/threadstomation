name: Threads Automation Cron

on:
  schedule:
    # Runs at :05 and :35 of every hour
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Target Threads Account'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - adhlil
          - tranvas
          - sharesaspace
      force:
        description: 'Force run immediately (bypass daily limit / cooldown)'
        type: boolean
        default: false

jobs:
  run-threads:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Run Dedicated Threads Cron
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.account }}" ] && [ "${{ inputs.account }}" != "all" ]; then
            ARGS="$ARGS --account ${{ inputs.account }}"
          fi
          node scripts/threads-cron.mjs $ARGS

