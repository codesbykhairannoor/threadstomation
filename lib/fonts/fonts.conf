<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Search for fonts in the same directory as this config file -->
  <dir prefix="relative">.</dir>
  <!-- Write font caches to Vercel's writable /tmp directory -->
  <cachedir>/tmp/fonts-cache</cachedir>
  <config></config>
</fontconfig>
