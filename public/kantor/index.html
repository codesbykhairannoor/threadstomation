<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kantor AI - Threadstomation</title>
    <script>
      // Single Page App redirect for GitHub Pages direct URL access
      const pathSegmentsToKeep = 1;
      const l = window.location;
      const target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?redirect=' +
        encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') + l.search) +
        l.hash;
      window.location.replace(target);
    </script>
    <meta http-equiv="refresh" content="0;URL='../#/kantor'">
  </head>
  <body>
    <p>Mengarahkan ke Kantor AI Threadstomation...</p>
  </body>
</html>
